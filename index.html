<body>

      BLVCK TAXI работает только с включённым JavaScript.
    </p>
  </noscript>

  <script src="./app.js?v=20260801"></script>
  <script src="./tax.js?v=20260801"></script>
  <script src="./pro.js?v=20260801"></script>

  <!-- =========================================================
       ЛАМПОЧКА-ДИАГНОСТИКА + СИЛОВАЯ ПЛАШКА PRO (временно).
       1) Рисует внизу строку HOST: <домен> | v20260801 — чтобы мы
          УВИДЕЛИ, с какого адреса Telegram реально открыл приложение.
       2) Вшивает плашку PRO напрямую, не дожидаясь pro.js и его хуков —
          в обход любого кеша pro.js. Читает статус из localStorage,
          чтобы текст был правильным даже без pro.js.
       Оба блока уберём, когда плашка встанет стабильно.
       ========================================================= -->
  <script>
  (function(){
    /* ---- 1) диагностический бейдж с реальным доменом ---- */
    function diag(){
      if(document.getElementById('blvck-diag')) return;
      var b=document.createElement('div');
      b.id='blvck-diag';
      b.style.cssText='position:fixed;left:8px;right:8px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;'+
        'font:600 10px/1.3 ui-monospace,monospace;letter-spacing:.4px;color:#fff;background:rgba(255,90,0,.92);'+
        'border-radius:8px;padding:6px 9px;text-align:center;pointer-events:none;word-break:break-all';
      b.textContent='HOST: '+location.hostname+' | v20260801';
      document.body.appendChild(b);
    }
    if(document.body) diag(); else document.addEventListener('DOMContentLoaded',diag);

    /* ---- 2) силовая плашка PRO, независимо от pro.js ---- */
    function proText(){
      try{
        var s=JSON.parse(localStorage.getItem('blvck_pro_status')||'{}');
        if(s&&s.active) return 'PRO активна · открыть →';
        if(s&&s.trial_active) return 'Триал PRO · '+(s.trial_days_left|0)+' дн. · открыть →';
      }catch(e){}
      return 'BLVCK PRO · авто‑отчёты, облако, налоги →';
    }
    function forcePlaque(){
      var tg=document.querySelector('.toolgrid');
      if(!tg) return false;                       /* главная ещё не отрисована — ждём */
      if(document.getElementById('pro-dash-plaque')) return true; /* уже есть (вшил pro.js) */
      var btn=document.createElement('button');
      btn.id='pro-dash-plaque';
      btn.className='pro-plaque';
      btn.setAttribute('data-action','proOpen');
      btn.innerHTML='<span class="pro-plaque-d"></span>'+
        '<span class="pro-plaque-t">'+proText()+'</span>'+
        '<span class="pro-plaque-a">открыть →</span>';
      btn.addEventListener('click',function(){
        if(window.BLVCK_PRO&&window.BLVCK_PRO.openScreen){ window.BLVCK_PRO.openScreen(); }
        else if(window.toast){ window.toast('Подписка загружается — тапни ещё раз'); }
      });
      tg.parentNode.insertBefore(btn, tg);
      return true;
    }
    var tries=0;
    var iv=setInterval(function(){
      if(forcePlaque() || ++tries>40) clearInterval(iv);   /* ~10 сек максимум */
    },250);
  })();
  </script>
</body>
</html>
