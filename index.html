<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#030f09" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BLVCK TAXI</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link rel="stylesheet" href="/src/styles/main.css" />

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
</head>
<body>
    <div id="app">

        <!-- WELCOME SCREEN -->
        <div id="welcomeScreen">
            <div class="welcome-content">
                <div class="welcome-icon"><i class="fas fa-taxi"></i></div>
                <div class="welcome-title">BLVCK <span class="highlight">TAXI</span></div>
                <div class="welcome-subtitle">Управляй расходами за 5 секунд</div>
                <button class="welcome-btn" id="welcomeBtn"><i class="fas fa-arrow-right"></i> Начать</button>
                <div class="welcome-features">
                    <span><i class="fas fa-circle"></i> 1 тап</span>
                    <span><i class="fas fa-circle"></i> Без интернета</span>
                    <span><i class="fas fa-circle"></i> Отчёт для бухгалтерии</span>
                </div>
            </div>
        </div>

        <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
        <div id="appContent" style="display:none;">

            <!-- ШАПКА -->
            <header class="app-header">
                <div class="brand"><i class="fas fa-taxi"></i> BLVCK TAXI</div>
                <div class="header-actions">
                    <button class="btn-icon" id="subscriptionBtn" title="Подписка PRO"><i class="fas fa-star"></i></button>
                    <button class="btn-icon" id="themeToggle"><i class="fas fa-moon"></i></button>
                    <button class="btn-icon" id="exportBtn" title="Скачать отчёт PDF"><i class="fas fa-file-pdf"></i></button>
                    <button class="btn-icon" id="settingsBtn" title="Настройки"><i class="fas fa-cog"></i></button>
                </div>
            </header>

            <!-- СТАТУС ПОДПИСКИ -->
            <div id="subscriptionStatus" style="margin:12px 0;"></div>

            <!-- КАРТОЧКА АВТОМОБИЛЯ -->
            <div id="carCard" style="margin:12px 0;"></div>

            <!-- ГЛАВНЫЙ ЭКРАН -->
            <main class="main-content" id="driverDashboard">

                <div class="day-header">
                    <span class="date" id="todayDate">СЕГОДНЯ</span>
                    <span class="total" id="dayTotal">0.00 BYN</span>
                </div>

                <div id="todayExpenses" class="expense-list">
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>Нет расходов за сегодня</p>
                        <p class="sub">Нажмите на кнопку ниже, чтобы добавить</p>
                    </div>
                </div>

                <div id="categoryGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 8px;"></div>

                <div class="week-total">
                    <span>📋 За последние 7 дней</span>
                    <span id="weekTotal">0.00 BYN</span>
                </div>

                <div class="quick-actions">
                    <button class="quick-btn fuel" data-category="fuel"><i class="fas fa-gas-pump"></i><span>Заправка</span></button>
                    <button class="quick-btn repair" data-category="repair"><i class="fas fa-wrench"></i><span>Ремонт</span></button>
                    <button class="quick-btn wash" data-category="wash"><i class="fas fa-spray-can"></i><span>Мойка</span></button>
                    <button class="quick-btn other" data-category="other"><i class="fas fa-ellipsis-h"></i><span>Другое</span></button>
                </div>

                <div class="secondary-actions">
                    <button><i class="fas fa-chart-pie"></i> Графики</button>
                    <button><i class="fas fa-folder"></i> Документы</button>
                    <button><i class="fas fa-wrench"></i> Журнал ТО</button>
                    <button><i class="fas fa-car"></i> Авто</button>
                    <button><i class="fas fa-credit-card"></i> Карты</button>
                </div>

                <!-- СКРЫТЫЕ КОНТЕЙНЕРЫ -->
                <div id="notesList" style="display:none;"></div>
                <div id="documentsList" style="display:none;"></div>
                <div id="fuelCardsList" style="margin:12px 0;"></div>

            </main>
        </div>
    </div>

    <!-- МОДАЛКА БЫСТРОГО ВВОДА -->
    <div class="modal-overlay" id="quickModal">
        <div class="modal modal-quick">
            <div class="modal-header">
                <h2 id="quickModalTitle"><i class="fas fa-plus-circle"></i> Добавить расход</h2>
                <button class="modal-close" id="quickModalClose"><i class="fas fa-times"></i></button>
            </div>
            <form id="quickForm">
                <input type="hidden" id="quickCategory" />
                <div class="form-group">
                    <label>Сумма (BYN)</label>
                    <input type="number" id="quickAmount" placeholder="0.00" step="0.01" min="0" required autofocus />
                </div>
                <div class="form-group">
                    <label>Описание (необязательно)</label>
                    <input type="text" id="quickDesc" placeholder="Заправка на АЗС №5" />
                </div>
                <button type="submit" class="btn-submit"><i class="fas fa-save"></i> Сохранить</button>
            </form>
        </div>
    </div>

    <!-- ОСНОВНАЯ МОДАЛКА -->
    <div class="modal-overlay" id="mainModal">
        <div class="modal" id="mainModalContent">
            <div class="modal-header">
                <h2 id="mainModalTitle">Заголовок</h2>
                <button class="modal-close" id="mainModalClose"><i class="fas fa-times"></i></button>
            </div>
            <div id="mainModalBody"></div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container" id="toastContainer"></div>

    <script type="module" src="/src/scripts/core/app.js"></script>
</body>
</html>
