<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="METR — учёт расходов для водителя такси: выручка, расходы, чеки, штрафы, ФСЗН и подписка PRO с авто‑отчётами. Всё офлайн, данные только в твоём телефоне.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="METR">
  <meta name="application-name" content="METR">

  <link rel="manifest" href="./manifest.webmanifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">

  <link rel="preconnect" href="https://telegram.org">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <title>METR — учёт для таксиста</title>

  <style>html,body{margin:0;background:#0a0a0a}#app{min-height:100vh}</style>
  <link rel="stylesheet" href="./styles.css?v=m1">
</head>
<body>
  <!-- Фоновые слои: сетка + частицы (уровень C, изолированные) -->
  <div class="bg-mesh"></div>
  <div class="bg-grid"></div>
  <div class="bg-particles" id="particles"></div>

  <main id="app" class="app"></main>
  <nav id="tabbar" class="tabbar" aria-label="Разделы"></nav>
  <div id="modal" class="modal-root" role="dialog" aria-modal="true" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="restoreInput" accept="application/json,.json"
         style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none">

  <noscript>
    <p style="color:#f3f3f8;font-family:system-ui,sans-serif;padding:24px;text-align:center">
      METR работает только с включённым JavaScript.
    </p>
  </noscript>

  <script src="./app.js?v=m1"></script>
  <script src="./tax.js?v=m1"></script>
  <script src="./pro.js?v=m1"></script>

  <!-- Генерация частиц -->
  <script>
  (function(){
    var container = document.getElementById('particles');
    if(!container) return;
    var count = 15;
    for(var i=0;i<count;i++){
      var p = document.createElement('span');
      p.style.left = Math.random()*100 + '%';
      p.style.animationDuration = (20 + Math.random()*30) + 's';
      p.style.animationDelay = (-Math.random()*40) + 's';
      p.style.width = p.style.height = (1 + Math.random()*2) + 'px';
      container.appendChild(p);
    }
  })();
  </script>
</body>
</html>
